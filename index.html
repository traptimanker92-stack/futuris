    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Futuris — Universal AI Career Simulator & Ecosystem</title>
    <meta name="description" content="Futuris: Next-generation AI career path simulation, live skill verification, customizable focus suite, and creative ATS resume generator." />
    <script>
      (function() {
        const theme = localStorage.getItem('futuris_theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>

  </body>
